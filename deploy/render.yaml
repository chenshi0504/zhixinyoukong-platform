# Render Blueprint：云端管理平台（API + 静态前端 + PostgreSQL）
# 用法：把仓库连接到 Render → New → Blueprint → 选择本仓库，按提示填写 ALLOWED_ORIGINS 与 VITE_API_BASE。
services:
  # ---------- 后端 API ----------
  - type: web
    name: zhixinyoukong-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zhixinyoukong-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS      # 填写前端实际域名，多个用逗号分隔
        sync: false
      - key: UPLOAD_DIR
        value: /data/uploads

  # ---------- 前端（Vue 3 静态站） ----------
  - type: web
    name: zhixinyoukong-web
    runtime: static
    plan: free
    buildCommand: cd cloud/frontend && npm install && npm run build
    staticPublishPath: ./cloud/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE        # 后端地址，如 https://zhixinyoukong-api.onrender.com
        sync: false

databases:
  - name: zhixinyoukong-db
    plan: free
    databaseName: clouddb
    user: clouduser
    region: singapore
