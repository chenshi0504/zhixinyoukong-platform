# 公网部署示例（VPS / 校内服务器）
#   cp deploy/.env.example .env    # 修改数据库口令、SECRET_KEY、ALLOWED_ORIGINS
#   docker compose -f deploy/docker-compose.public.yml up -d --build
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clouddb}
      POSTGRES_USER: ${POSTGRES_USER:-clouduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?please-set-POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clouduser} -d ${POSTGRES_DB:-clouddb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clouddb}
      SECRET_KEY: ${SECRET_KEY:?please-set-SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: nginx:alpine
    volumes:
      - ../cloud/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site-dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
