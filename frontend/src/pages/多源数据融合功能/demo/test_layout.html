<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>融合结果布局测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        
        h2 {
            color: #2C5AA0;
            margin-bottom: 20px;
        }
        
        /* 融合结果行 */
        .fusion-results-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        
        .fusion-results-row .result-card {
            flex: 1 1 calc(33.333% - 14px);
            min-width: 280px;
            max-width: calc(33.333% - 14px);
        }
        
        .result-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .result-card.fusion-result {
            border-color: #2C5AA0;
            background: linear-gradient(135deg, #f8f9fa 0%, #e3f2fd 100%);
        }
        
        .result-header {
            background: #2C5AA0;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }
        
        .result-content {
            padding: 20px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .placeholder-content {
            text-align: center;
            color: #666;
        }
        
        .placeholder-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        @media (max-width: 1024px) {
            .fusion-results-row .result-card {
                flex: 1 1 calc(50% - 10px);
                max-width: calc(50% - 10px);
            }
        }
        
        @media (max-width: 768px) {
            .fusion-results-row {
                flex-direction: column;
            }
            
            .fusion-results-row .result-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>融合结果展示 - 布局测试</h2>
        
        <div class="fusion-results-row">
            <div class="result-card">
                <div class="result-header">
                    <span class="result-title">YOLO检测结果</span>
                    <span class="result-count">12</span>
                </div>
                <div class="result-content">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🔍</div>
                        <p>YOLO检测数据</p>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">卡片1 - 应该占33.33%宽度</p>
                    </div>
                </div>
            </div>
            
            <div class="result-card">
                <div class="result-header">
                    <span class="result-title">点云熵结果</span>
                    <span class="result-count">8</span>
                </div>
                <div class="result-content">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">📊</div>
                        <p>点云熵数据</p>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">卡片2 - 应该占33.33%宽度</p>
                    </div>
                </div>
            </div>
            
            <div class="result-card fusion-result">
                <div class="result-header">
                    <span class="result-title">贝叶斯融合结果</span>
                    <span class="result-count">10</span>
                </div>
                <div class="result-content">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🔄</div>
                        <p>融合结果数据</p>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">卡片3 - 应该占33.33%宽度</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 30px; padding: 15px; background: #e8f4f8; border-radius: 6px;">
            <p style="color: #2C5AA0; font-size: 14px;">
                <strong>说明：</strong> 三个卡片应该平均分布，每个占据约33.33%的宽度，间距为20px。
            </p>
            <p style="color: #666; font-size: 13px; margin-top: 8px;">
                调整浏览器窗口大小可以测试响应式布局：
                <br>• 大屏幕（>1024px）：三列布局
                <br>• 中等屏幕（768px-1024px）：两列布局
                <br>• 小屏幕（<768px）：单列布局
            </p>
        </div>
    </div>
    <script src="/src/components/interaction-feedback.js"></script>
</body>
</html>
